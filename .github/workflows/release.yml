name: Release

# Build check only. Releases are published to fury by publish.yaml; this fork
# must not publish the `betterproto` name to public PyPI.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

jobs:
  packaging:
    name: Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install poetry
        run: python -m pip install poetry
      - name: Build package
        run: poetry build
